name: Hosted mathematics

on:
  pull_request:
    paths:
      - '**.md'
      - 'verification/hosted_math/**'
      - '.github/workflows/hosted-math.yml'

permissions:
  contents: read

concurrency:
  group: hosted-math-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAPTURE_REVISION: 337ceaaf1899aeb65fd5dbb0c97c015793742923
    steps:
      - name: Check out the validation helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the exact scientific source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CAPTURE_REVISION }}
          path: checked-source
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the capture runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install chromium
      - name: Probe inline display and table mathematics
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/probe_hosted_math.cjs --root "$GITHUB_WORKSPACE/checked-source" --repository "$GITHUB_REPOSITORY" --revision "$CAPTURE_REVISION" --page README.md --output "$RUNNER_TEMP/hosted-probe-readme" || echo "README probe reported a diagnostic failure"
          node verification/hosted_math/probe_hosted_math.cjs --root "$GITHUB_WORKSPACE/checked-source" --repository "$GITHUB_REPOSITORY" --revision "$CAPTURE_REVISION" --page science/model.md --output "$RUNNER_TEMP/hosted-probe-model" || echo "Proof probe reported a diagnostic failure"
      - name: Print diagnostics before the full comparison
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/hosted-probe-*/probe-report.json; do
            test ! -f "$f" || python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r["page"], r["status"], r["failures"])' "$f"
          done
      - name: Compare every hosted mathematical expression
        if: ${{ !cancelled() }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE/checked-source" --repository "$GITHUB_REPOSITORY" --revision "$CAPTURE_REVISION" --output "$RUNNER_TEMP/hosted-math-first" || {
            status=$?
            if test -f "$RUNNER_TEMP/hosted-math-first/hosted-report.json" && grep -Eq 'HTTP (502|503|504)' "$RUNNER_TEMP/hosted-math-first/hosted-report.json"; then
            node verification/hosted_math/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE/checked-source" --repository "$GITHUB_REPOSITORY" --revision "$CAPTURE_REVISION" --output "$RUNNER_TEMP/hosted-math" --resume-from "$RUNNER_TEMP/hosted-math-first"
            else
              exit "$status"
            fi
          }
      - name: Retain the actual captures and comparison reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-${{ env.CAPTURE_REVISION }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hosted-math
            ${{ runner.temp }}/hosted-math-first
            ${{ runner.temp }}/hosted-probe-readme
            ${{ runner.temp }}/hosted-probe-model
          if-no-files-found: error
          retention-days: 14
